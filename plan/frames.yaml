# plan/frames.yaml -- frame lexicon for the density / transit meeting corpus
# (plan/ANALYSIS-transit.md 2). Seeded 2026-09-21 from the T1 pilot: 46
# transcribed episodes, 4 bodies, 69k words (output/analysis/a0_frame_counts.csv
# has the count behind every term). Read by analysis/a0_terms.py.
#
# Format (deliberately a YAML subset so no library is needed): a frame is a
# top-level `key:` line followed by `- term` lines; `#` starts a comment; terms
# are matched whole-word, case-insensitive, with an optional 's, and a space
# in a term matches whitespace or a hyphen (pipeline/segment.py load_keywords).
#
# "0 hits" marks a term that did not occur in the pilot. It stays in the list
# so the next corpus reports it, rather than quietly disappearing. Bare words
# that turned out to mean something else in context are NOT listed; the
# reasons are in the comment next to the frame (KWIC in a0_kwic.md).

